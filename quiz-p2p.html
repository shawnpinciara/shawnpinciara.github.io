<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz P2P</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
#app{width:100%;max-width:700px}
.screen{display:none;flex-direction:column;align-items:center;animation:fadeIn .4s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:2.2em;margin-bottom:10px;background:linear-gradient(90deg,#00d2ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:1.5em;margin-bottom:20px;color:#a8b2d1}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:40px;width:100%;text-align:center;margin-bottom:20px}
.btn{padding:14px 36px;font-size:1.1em;border:none;border-radius:12px;cursor:pointer;font-weight:600;transition:all .3s;margin:8px}
.btn-primary{background:linear-gradient(90deg,#00d2ff,#7b2ff7);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(123,47,247,.4)}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.btn-secondary:hover{background:rgba(255,255,255,.2)}
.btn-success{background:linear-gradient(90deg,#00b894,#00cec9);color:#fff}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,184,148,.4)}
.btn-danger{background:linear-gradient(90deg,#e17055,#d63031);color:#fff}
.btn-lg{padding:20px 50px;font-size:1.3em}
.btn-sm{padding:8px 20px;font-size:.9em}
.input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 20px;color:#fff;font-size:1.1em;width:100%;text-align:center;outline:none;margin:10px 0;transition:border .3s}
.input:focus{border-color:#00d2ff}
.input::placeholder{color:rgba(255,255,255,.4)}
code{background:rgba(0,0,0,.3);padding:4px 12px;border-radius:8px;font-size:.9em;color:#00d2ff}
.students-list{margin:15px 0;max-height:200px;overflow-y:auto}
.student-item{background:rgba(255,255,255,.05);border-radius:10px;padding:10px 15px;margin:5px 0;display:flex;justify-content:space-between;align-items:center}
.student-item .score{color:#00cec9;font-weight:700}
.q-progress{color:#a8b2d1;margin-bottom:15px;font-size:.95em}
.q-text{font-size:1.35em;margin-bottom:10px;line-height:1.5}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.opt-btn{padding:18px;font-size:1.1em;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;cursor:pointer;transition:all .3s;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.opt-btn:hover:not(.disabled){background:rgba(255,255,255,.15);border-color:#00d2ff;transform:scale(1.03)}
.opt-btn.correct{background:rgba(0,200,100,.3);border-color:#00cec9}
.opt-btn.wrong{background:rgba(220,50,50,.3);border-color:#d63031}
.opt-btn.disabled{pointer-events:none;opacity:.6}
.opt-btn.selected{background:rgba(123,47,247,.3);border-color:#7b2ff7}
.opt-letter{font-size:1.4em;font-weight:700;min-width:28px}
.leaderboard{width:100%;margin-top:20px}
.leaderboard-row{display:flex;justify-content:space-between;padding:12px 20px;background:rgba(255,255,255,.05);border-radius:10px;margin:5px 0;align-items:center}
.leaderboard-row .rank{font-weight:700;color:#00d2ff;width:30px;font-size:1.2em}
.leaderboard-row .name{flex:1;text-align:left;margin-left:10px}
.leaderboard-row .pts{color:#00cec9;font-weight:700}
.room-code-display{font-size:2em;letter-spacing:4px;margin:20px 0;padding:15px;background:rgba(0,0,0,.3);border-radius:12px;font-family:monospace}
.share-btn{margin-top:10px}
.info-text{color:#a8b2d1;margin:8px 0;font-size:.9em}
.error-text{color:#d63031;margin:8px 0;font-size:.9em}
.flex-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-top-color:#00d2ff;border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const FIREBASE_CONFIG={
  apiKey:"AIzaSyDemoKeyReplaceWithYours",
  authDomain:"demo.firebaseapp.com",
  databaseURL:"https://demo-default-rtdb.firebaseio.com",
  projectId:"demo",
  storageBucket:"demo.appspot.com",
  messagingSenderId:"000000000000",
  appId:"1:000000000000:web:0000000000000000"
};

let S={role:null,roomCode:'',questions:[],myId:'',
  conn:null,connections:{},names:{},curQ:0,myAns:[],
  results:[],db:null,roomRef:null};

function parseQuiz(){
  const h=location.hash.slice(1);
  if(!h)return[];
  return h.split(';').filter(p=>p.includes('|')).map(part=>{
    const seg=part.split('|');
    const question=seg[0];
    const opts=[];
    let correct='';
    for(let i=1;i<seg.length&&i<=4;i++){
      const s=seg[i];
      const letter=s.slice(-1);
      const text=s.slice(0,-1);
      if(letter===letter.toUpperCase()&&/^[A-D]$/.test(letter)&&!correct)correct=letter;
      opts.push({letter,text});
    }
    return{text:question.replace(/_/g,' ').replace(/^\w/,c=>c.toUpperCase()),opts,correct};
  });
}
function genCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function setHTML(html){document.getElementById('app').innerHTML=html}

function initFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    S.db=firebase.database();
    return true;
  }catch(e){
    return false;
  }
}

function initRole(){
  setHTML(`<div class="screen active">
    <h1>🧠 Quiz P2P</h1>
    <div class="card">
      <h2>Scegli il tuo ruolo</h2>
      <div class="flex-row" style="margin-top:20px">
        <button class="btn btn-primary btn-lg" onclick="doRole('teacher')">👨‍🏫 Insegnante</button>
        <button class="btn btn-secondary btn-lg" onclick="doRole('student')">👨‍🎓 Studente</button>
      </div>
      <p class="info-text" style="margin-top:25px">Formato link: <code>pagina.html#Domanda|testoA|testoBb|testoCc|testoDd;Dom2|opt1a|opt2A|opt3c|opt4d</code></p>
      <p class="info-text">La lettera <strong>MAIUSCOLA</strong> indica la risposta corretta</p>
    </div></div>`);
}

function doRole(r){
  S.role=r;S.questions=parseQuiz();
  if(!initFirebase()){
    alert('Errore Firebase. Controlla la configurazione nel codice sorgente.');
    return;
  }
  if(r==='teacher'){S.roomCode=genCode();initTeacher()}
  else initStudJoin();
}

function initTeacher(){
  S.roomRef=S.db.ref('rooms/'+S.roomCode);
  S.roomRef.set({teacher:{id:'teacher',name:'Insegnante'},questions:S.questions,answers:{},started:false,finished:false});
  
  S.roomRef.on('value',snap=>{
    const data=snap.val();
    if(!data)return;
    S.connections={};
    if(data.connections)S.connections=data.connections;
    if(data.answers)S.answers=data.answers;
    if(data.started)startQuizFromFirebase();
    if(data.finished&&data.results)showResultsFromFirebase(data.results);
    renderTeacher();
  });
  renderTeacher();
}

function onTeacherData(path,data){
  S.roomRef.update(data);
}

function renderTeacher(){
  const qs=S.questions.length;
  const conns=S.connections||{};
  const ids=Object.keys(conns);
  let studentList='';
  if(ids.length===0){
    studentList='<p style="color:#a8b2d1;padding:10px">⏳ In attesa di studenti...</p>';
  }else{
    studentList=ids.map((sid,i)=>{
      const nm=(conns[sid]&&conns[sid].name)||`Studente ${i+1}`;
      const ans=S.answers&&S.answers[sid]?S.answers[sid]:null;
      const sc=ans?ans.filter((a,qi)=>a===S.questions[qi].correct).length:null;
      return`<div class="student-item"><span>${esc(nm)}</span><span class="score">${sc!==null?sc+'/'+qs:''}</span></div>`;
    }).join('');
  }
  setHTML(`<div class="screen active">
    <h1>🧠 Quiz P2P</h1>
    <div class="card">
      <h2>👨‍🏫 Insegnante</h2>
      <p class="info-text">Codice stanza: <code>${S.roomCode}</code></p>
      <div class="room-code-display">${S.roomCode}</div>
      <button class="btn btn-primary share-btn" onclick="copyCode()">📋 Copia link</button>
      <p class="info-text" style="margin-top:15px">Studenti connessi: <strong>${ids.length}</strong></p>
      <div class="students-list">${studentList}</div>
      <button class="btn btn-success btn-lg" ${qs===0?'disabled style="opacity:.5"':''} onclick="startQuiz()">🚀 Inizia Quiz (${qs} domande)</button>
      <button class="btn btn-danger" id="endBtn" style="display:none" onclick="finishQuiz()">🏁 Fine Quiz</button>
      <div id="tRes"></div>
    </div></div>`);
}

function copyCode(){
  const u=location.href.split('#')[0]+'#'+S.roomCode;
  navigator.clipboard.writeText(u).catch(()=>{});
  alert('Link copiato!\n'+u);
}

function startQuiz(){
  const conns=S.connections||{};
  if(Object.keys(conns).length===0){alert('Nessuno studente connesso!');return}
  S.roomRef.update({started:true,answers:{},finished:false});
  $('endBtn').style.display='inline-block';
}

function startQuizFromFirebase(){
  const endBtn=$('endBtn');
  if(endBtn)endBtn.style.display='inline-block';
}

function finishQuiz(){
  const conns=S.connections||{};
  const ids=Object.keys(conns);
  const results=[];
  ids.forEach(sid=>{
    const ans=S.answers&&S.answers[sid]?S.answers[sid]:[];
    const sc=ans.reduce((acc,a,i)=>a===S.questions[i].correct?acc+1:acc,0);
    results.push({name:(conns[sid]&&conns[sid].name)||sid,score:sc,total:S.questions.length});
  });
  S.roomRef.update({finished:true,results:results});
  $('endBtn').style.display='none';
  renderTeacher();
  const el=$('tRes');if(el)el.innerHTML=`<div class="leaderboard"><h2 style="margin-bottom:15px">📊 Classifica Finale</h2>${rankHTML(results)}</div>`;
}

function showResultsFromFirebase(results){
  const el=$('sRes');if(el)el.innerHTML=`<div class="leaderboard"><h2 style="margin-bottom:15px">📊 Classifica</h2>${rankHTML(results)}</div>`;
}

function rankHTML(res){
  const s=[...res].sort((a,b)=>b.score-a.score);
  return s.map((r,i)=>{
    const m=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
    return`<div class="leaderboard-row"><span class="rank">${m}</span><span class="name">${esc(r.name)}</span><span class="pts">${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</span></div>`;
  }).join('');
}

function initStudJoin(){
  setHTML(`<div class="screen active">
    <h1>🧠 Quiz P2P</h1>
    <div class="card">
      <h2>👨‍🎓 Studente</h2>
      <p class="info-text">Inserisci il codice stanza dell'insegnante</p>
      <input class="input" placeholder="Codice stanza" id="joinCode" maxlength="8" onkeypress="if(event.key==='Enter')joinRoom()">
      <button class="btn btn-primary btn-lg" onclick="joinRoom()">🔗 Connetti</button>
      <div id="jErr" class="error-text"></div>
    </div></div>`);
}

function joinRoom(){
  const c=$('joinCode').value.trim().toUpperCase();
  if(!c){$('jErr').textContent='Inserisci un codice';return}
  initStudent(c);
}

function initStudent(roomId){
  S.roomCode=roomId;
  const roomRef=S.db.ref('rooms/'+roomId);
  const studentId='student_'+Math.random().toString(36).slice(2,6);
  S.roomRef=roomRef;S.myId=studentId;
  
  // Write student info
  roomRef.update({connections:{[studentId]:{name:'Studente',id:studentId}}});
  
  // Listen for changes
  roomRef.on('value',snap=>{
    const data=snap.val();
    if(!data)return;
    S.connections=data.connections||{};
    S.answers=data.answers||{};
    if(data.started&&!S.questions.length&&data.questions){
      S.questions=data.questions;S.curQ=0;S.myAns=[];S.results=[];
      renderStudQuiz();
    }
    if(data.finished&&data.results){
      showResultsFromFirebase(data.results);
    }
    renderStudWait();
  });
  
  // Listen for quiz start
  roomRef.child('started').on('value',snap=>{
    if(snap.val()===true&&data&&data.questions){
      S.questions=data.questions;S.curQ=0;S.myAns=[];S.results=[];
      renderStudQuiz();
    }
  });
  
  // Listen for answers
  roomRef.child('answers').on('value',snap=>{
    if(snap.val()){
      S.answers=snap.val();
      const ans=S.answers[S.myId];
      if(ans&&ans.length>=S.questions.length&&S.myAns.length>=S.questions.length){
        // Check if all questions answered
      }
    }
  });
  
  // Listen for results
  roomRef.child('results').on('value',snap=>{
    if(snap.val()){
      showResultsFromFirebase(snap.val());
    }
  });
  
  renderStudWait();
}

function renderStudWait(){
  setHTML(`<div class="screen active">
    <h1>🧠 Quiz P2P</h1>
    <div class="card">
      <div class="spinner"></div>
      <h2 style="margin-top:10px">⏳ Attendi l'inizio del quiz...</h2>
      <p class="info-text">L'insegnante avvierà il quiz a breve</p>
      <p class="info-text" style="font-size:.8em">Codice stanza: <code>${S.roomCode}</code></p>
    </div></div>`);
}

function renderStudQuiz(){
  const qs=S.questions.length;
  if(S.curQ>=qs){
    setHTML(`<div class="screen active">
      <h1>🧠 Quiz P2P</h1>
      <div class="card"><h2>✅ Risposte inviate!</h2><p class="info-text">In attesa dei risultati...</p></div></div>`);
    return;
  }
  const q=S.questions[S.curQ];
  if(!q){renderStudWait();return}
  const answered=!!S.myAns[S.curQ];
  const optBtns=q.opts.map((o,i)=>{
    const letter='ABCD'[i];
    const isCorrect=q.correct===letter;
    const isSelected=S.myAns[S.curQ]===letter;
    let cls='opt-btn';
    if(isSelected&&isCorrect)cls+=' correct';
    else if(isSelected&&!isCorrect)cls+=' wrong';
    else if(answered&&isCorrect)cls+=' correct';
    else if(answered)cls+=' disabled';
    else if(isSelected)cls+=' selected';
    return`<button class="${cls}" ${answered?'disabled':''} onclick="answer('${letter}')"><span class="opt-letter">${letter}</span>${esc(o.text)}</button>`;
  }).join('');
  setHTML(`<div class="screen active">
    <h1>🧠 Quiz P2P</h1>
    <div class="card">
      <div class="q-progress">Domanda ${S.curQ+1} di ${qs}</div>
      <div class="q-text">${esc(q.text)}</div>
      <div class="options">${optBtns}</div>
      ${answered?'<p style="color:#00cec9;font-size:1.1em">✅ Risposta inviata!</p>':''}
      ${S.curQ>=qs-1&&S.myAns.filter(a=>a).length>=qs?'<button class="btn btn-success" style="margin-top:10px" onclick="sendDone()">📤 Fine quiz</button>':''}
      <div id="sRes"></div>
    </div></div>`);
}

function answer(l){
  if(S.myAns[S.curQ]||!S.roomRef)return;
  S.myAns[S.curQ]=l;
  const newAnswers={...S.answers};
  if(!newAnswers[S.myId])newAnswers[S.myId]=[];
  newAnswers[S.myId][S.curQ]=l;
  S.roomRef.update({answers:newAnswers});
  S.curQ++;
  renderStudQuiz();
}

function sendDone(){
  if(!S.roomRef||S.myAns.filter(a=>a).length<S.questions.length)return;
  S.roomRef.update({done:true});
}

initRole();
</script>
</body>
</html>
